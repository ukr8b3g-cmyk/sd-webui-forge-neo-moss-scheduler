name: Publish verified scheduler release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moss-scheduler-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ukr8b3g-cmyk/sd-webui-forge-neo-moss-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check syntax and version
        run: |
          python3 -m compileall -q forge_moss_scheduler scripts tests
          node --check javascript/moss_scheduler_help.js
          python3 - <<'PY'
          import ast, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert version == '0.9.1'
          module = ast.parse(pathlib.Path('forge_moss_scheduler/__init__.py').read_text())
          assert ast.literal_eval(module.body[0].value) == version
          assert pathlib.Path('docs/RELEASE_NOTES_0.9.1.md').is_file()
          PY
      - name: Publish v0.9.1 without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.1 >/dev/null 2>&1; then
            echo 'Release exists; no tag or asset changes.'
            exit 0
          fi
          if gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.9.1 >/dev/null 2>&1; then
            echo 'Tag exists without release; refusing to move it.'
            exit 1
          fi
          gh release create v0.9.1 --target "$GITHUB_SHA" \
            --title 'Forge Neo MOSS Scheduler v0.9.1' \
            --notes-file docs/RELEASE_NOTES_0.9.1.md --latest
